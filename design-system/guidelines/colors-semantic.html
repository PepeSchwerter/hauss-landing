<!-- @dsCard group="Colors" viewport="700x210" name="Semantic Surfaces" subtitle="How the palette maps to surfaces & text" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-family:var(--font-body);font-size:12px">
<div style="background:var(--surface-page);border:1px solid var(--border-default);padding:14px;height:150px;display:flex;flex-direction:column;justify-content:space-between"><span>surface-page</span><strong style="color:var(--text-primary)">Text primary</strong></div>
<div style="background:var(--surface-alt);border:1px solid var(--border-default);padding:14px;height:150px;display:flex;flex-direction:column;justify-content:space-between"><span>surface-alt</span><strong style="color:var(--text-secondary)">Text secondary</strong></div>
<div style="background:var(--surface-inverse);padding:14px;height:150px;display:flex;flex-direction:column;justify-content:space-between;color:var(--text-inverse)"><span>surface-inverse</span><strong>Text inverse</strong></div>
<div style="background:var(--surface-soft);padding:14px;height:150px;display:flex;flex-direction:column;justify-content:space-between"><span>surface-soft</span><strong style="color:var(--text-primary)">On pink tint</strong></div>
</div>
